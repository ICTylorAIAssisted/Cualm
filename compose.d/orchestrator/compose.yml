# Orchestrator extension — XMPP-triggered task runner
#
# Spawns a fresh agent container for each task received via XMPP.
# Requires the xmpp/ extension for Prosody.
#
# The user messages orchestrator@cua.local from their phone.
# The orchestrator spawns a cua-agent container, streams output,
# and sends the result back when done.

services:
  orchestrator:
    build: ./compose.d/orchestrator/orchestrator
    container_name: cua-orchestrator
    depends_on:
      - prosody
    environment:
      # XMPP connection
      ORCH_XMPP_JID: orchestrator@cua.local
      ORCH_XMPP_PASSWORD: ${XMPP_ORCH_PASSWORD:-orch-secret}
      ORCH_XMPP_HOST: prosody
      ORCH_XMPP_PORT: "5222"
      ORCH_XMPP_VERIFY_CERT: "false"
      ORCH_ALLOWED_USER: user@cua.local
      # External host:port for file upload URLs reachable from phones
      # e.g. 192.168.50.198:5280
      ORCH_HTTP_HOST: ${XMPP_HTTP_HOST:-}
      # MUC domain for task rooms
      ORCH_MUC_DOMAIN: conference.cua.local
      # Agent container settings
      CUA_AGENT_IMAGE: ${CUA_AGENT_IMAGE:-cua-agent}
      CUA_DOCKER_NETWORK: ${CUA_DOCKER_NETWORK:-}
      CUA_AGENT_TIMEOUT: ${CUA_AGENT_TIMEOUT:-600}
      CUA_CALIBRATION_VOLUME: ${COMPOSE_PROJECT_NAME:-cua-minimal}_cua-calibration
      # LLM settings passed through to spawned agents
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:8000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-needed}
      CUA_MODEL: ${CUA_MODEL:-your-model-name}
      # The host's runtime socket is mounted to /var/run/docker.sock
      # regardless of where it lives on the host.  Don't pass through
      # the host's DOCKER_HOST — it points to a path that doesn't
      # exist inside this container.
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      # Mount whichever socket exists — Docker or Podman.
      # For rootful Podman: /run/podman/podman.sock
      # For rootless Podman: /run/user/<UID>/podman/podman.sock
      # For Docker: /var/run/docker.sock
      # Override CUA_RUNTIME_SOCKET if your setup differs.
      - ${CUA_RUNTIME_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:z
    # Podman needs label=disable to access the mounted socket
    security_opt:
      - label=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Register the orchestrator XMPP account in Prosody
  prosody:
    environment:
      XMPP_ORCH_USER: orchestrator
      XMPP_ORCH_PASSWORD: ${XMPP_ORCH_PASSWORD:-orch-secret}

  # When the orchestrator is active, the base cua container
  # should not run its own XMPP daemon — the orchestrator
  # handles all messaging.
  cua:
    environment:
      XMPP_AUTO_START: "false"
