[screen]
width = 1280
height = 800
display = :99

[calibration]
dir = /var/cua/calibration

[mouse]
move_delay = 0.1
default_button = 1
double_click_repeat = 2
double_click_delay_ms = 100

[keyboard]
type_delay_ms = 30

[scroll]
default_clicks = 3

[screenshot]
path = /tmp/screen.png
tool = scrot
tool_args = --pointer {path} --overwrite

[run]
max_output_bytes = 5000
output_dir = /tmp/cua_runs

[agent]
max_steps = 50
post_action_delay = 0.8
wait_default_ms = 1000

[llm]
max_tokens = 8192
temperature = 0
max_api_errors = 3
max_parse_errors = 5
max_history_pairs = 1
preamble_size = 4

[audit]
base_dir = /app/audit
