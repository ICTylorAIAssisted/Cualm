# cualm sandbox — MCP server mode.
#
#   docker compose up -d        (or: ./cualm up)
#   MCP endpoint: http://localhost:8765/mcp
#   VNC (watch):  localhost:5900
#
# OPENAI_* / CUA_MODEL are only needed for the run_task tool.

services:
  cualm:
    build: .
    image: cualm
    container_name: cualm
    command: ["serve"]
    environment:
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://host.docker.internal:8000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-needed}
      CUA_MODEL: ${CUA_MODEL:-your-model-name}
    ports:
      - "127.0.0.1:${CUA_MCP_PORT:-8765}:8765"
      - "127.0.0.1:${CUA_VNC_PORT:-5900}:5900"
    volumes:
      - cualm-calibration:/var/cua/calibration
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: 1gb

volumes:
  cualm-calibration:
